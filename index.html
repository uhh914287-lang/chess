<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنجي - منصة التحليل والافتتاحيات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2rem;
            color: #38bdf8;
        }
        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 950px;
            width: 100%;
        }
        #board {
            width: 400px;
            max-width: 100%;
        }
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        .info-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header>
        <h1>شطرنجي - موسوعة الافتتاحيات والمحلل</h1>
        <p>اكتشاف الافتتاحيات والتحليل بالذكاء الاصطناعي</p>
    </header>

    <div class="main-container">
        <div id="board"></div>

        <div class="panel">
            <h3>لوحة التحكم والتحليل</h3>
            <div class="info-box" id="status">الدور: الأبيض</div>
            <div class="info-box" id="opening-name"><b>الافتتاحية:</b> اللعبة تبدأ من البداية</div>
            <button id="analyze-btn">تحليل الموقف (Stockfish)</button>
            <div class="info-box" id="eval-result">اضغط على زر التحليل لقراءة تقييم الذكاء الاصطناعي...</div>
            <button id="reset-btn" style="background: #64748b; color: #fff;">إعادة ضبط اللوحة</button>
        </div>
    </div>

    <!-- استدعاء الملف البرمجي المنفصل -->
    <script src="game.js"></script>
</body>
</html>
