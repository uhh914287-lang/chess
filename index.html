<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنجي - منصة التحليل الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبات Chess.js و Chessboard.js و jQuery الشهيرة لتشغيل رقعة شطرنج حقيقية وتحليلها -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2rem;
            color: #38bdf8;
        }
        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }
        #board {
            width: 400px;
            max-width: 100%;
        }
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        .eval-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            min-height: 80px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header>
        <h1>شطرنجي - محلل المباريات</h1>
        <p>حلل مواقفك بذكاء اصطناعي فوري بملف واحد</p>
    </header>

    <div class="main-container">
        <!-- رقعة الشطرنج -->
        <div id="board"></div>

        <!-- لوحة التحكم والتحليل -->
        <div class="panel">
            <h3>لوحة التحكم</h3>
            <div id="status">الدور: الأبيض</div>
            <button id="analyze-btn">تحليل الموقف (Stockfish)</button>
            <div class="eval-box" id="eval-result">اضغط على زر التحليل لقراءة تقييم الذكاء الاصطناعي...</div>
            <button id="reset-btn" style="background: #64748b; color: #fff;">إعادة ضبط اللوحة</button>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();
        var statusEl = $('#status');
        var evalResultEl = $('#eval-result');

        // تحديث حالة الدور النصية
        function updateStatus() {
            var moveColor = (game.turn() === 'w') ? 'الأبيض' : 'الأسود';
            if (game.in_checkmate()) {
                statusEl.text('كش مات! انتهت اللعبة.');
            } else if (game.in_draw()) {
                statusEl.text('تعادل!');
            } else {
                statusEl.text('دور اللاعب: ' + moveColor);
                if (game.in_check()) {
                    statusEl.text(statusEl.text() + ' (كش!)');
                }
            }
        }

        // عند بدء سحب القطعة
        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;
            // منع تحريك قطع الخصم
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        // عند إفلات القطعة في مربع جديد
        function onDrop(source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // ترقية العساكر تلقائياً لوزير للتسطيح
            });

            if (move === null) return 'snapback'; // إرجاع القطعة إذا كانت النقلة غير قانونية

            updateStatus();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };

        board = Chessboard('board', config);
        updateStatus();

        // زر إعادة الضبط
        $('#reset-btn').on('click', function () {
            game.reset();
            board.start();
            updateStatus();
            evalResultEl.text('تمت إعادة ضبط اللوحة.');
        });

        // زر تحليل الموقف باستخدام Stockfish عبر الـ API السحابي المجاني
        $('#analyze-btn').on('click', function () {
            evalResultEl.text('جاري تحليل الموقف بواسطة المحرك...');
            var fen = game.fen();
            
            // طلب تحليل النقلة الحالية من محرك ستاكفيش السحابي
            $.get('https://stockfish.online/api/s/v2.php?fen=' + encodeURIComponent(fen) + '&depth=10', function(data) {
                if (data.success) {
                    var evaluationText = "";
                    if (data.mate) {
                        evaluationText = `マット إماتة قريبة خلال ${data.mate} نقلات!`;
                    } else {
                        evaluationText = `التقييم الرقمي: ${data.evaluation > 0 ? '+' : ''}${data.evaluation / 100} (أفضل تفوق)`;
                    }
                    evalResultEl.html(`<b>نتيجة التحليل:</b><br>${evaluationText}<br><small>أفضل نقلة مقترحة: ${data.bestmove.split(' ')[1] || 'غير متوفرة'}</small>`);
                } else {
                    evalResultEl.text('تعذر الاتصال بالمحرك، جرب مرة أخرى.');
                }
            }).fail(function() {
                evalResultEl.text('خطأ في الاتصال بخدمة التحليل.');
            });
        });
    </script>
</body>
</html>
